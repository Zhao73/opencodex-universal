name: Preview release assets

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: "Immutable commit SHA to release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Verify dispatched SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          test -n "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Build immutable release assets
        run: bun run build:release-assets

      - name: Verify manifest and checksum
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const dir = "dist/release";
          const manifest = JSON.parse(fs.readFileSync(path.join(dir, "release-manifest.json"), "utf8"));
          const artifact = path.join(dir, manifest.artifact.name);
          const digest = crypto.createHash("sha256").update(fs.readFileSync(artifact)).digest("hex");
          if (digest !== manifest.artifact.sha256) throw new Error("manifest SHA-256 mismatch");
          if (fs.statSync(artifact).size !== manifest.artifact.size) throw new Error("manifest size mismatch");
          if (fs.readFileSync(`${artifact}.sha256`, "utf8").trim() !== digest) throw new Error("checksum asset mismatch");
          NODE

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists"
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh release create "$tag" dist/release/* \
            --prerelease \
            --title "OpenCodex Universal ${version}" \
            --notes "Cross-platform preview for macOS and Windows. Installers verify the attached SHA-256 before a staged, rollback-safe activation."
